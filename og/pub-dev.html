<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>gleon pub.dev screenshot</title>
<!-- Source of the pub.dev screenshot of the Flutter package (flutter/doc/screenshot.webp, 1200x1200).
     pub.dev also shows it as a small thumbnail in search results: keep only text that is still
     readable at 1/10 of the size (the headline and two bars). Numbers: the passing 390x844 row of
     "Performance" in the package README. Re-render with headless Chrome, then convert
     (cwebp -lossless):
     chrome --headless=new --hide-scrollbars --blink-settings=preferredColorScheme=1 --window-size=1200,1200 --screenshot=screenshot.png og/pub-dev.html -->
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { width: 1200px; height: 1200px; overflow: hidden; background: var(--bg); }
  .card {
    display: flex; flex-direction: column; justify-content: space-between;
    width: 1200px; height: 1200px; padding: 64px 72px 60px;
    border-bottom: 16px solid var(--ink);
  }
  .card .wordmark { font-size: 6rem; }
  .card h1 { margin-top: 20px; font-size: 12rem; line-height: 0.95; letter-spacing: -0.04em; }
  .card h1 em { font-style: normal; color: var(--flutter); }
  .bars { display: grid; gap: 40px; list-style: none; }
  .bars li { display: grid; gap: 12px; }
  .bars p {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 4rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1;
  }
  .bars p span { font-variant-numeric: tabular-nums; }
  .bars .bar { display: block; width: var(--w); height: 88px; border-radius: 12px; }
  .bars .flutter .bar { background: #a4acb6; }
  .bars .gleon .bar { background: var(--flutter); }
  .note { font-size: 2.25rem; color: var(--muted); }
</style>
</head>
<body>
<div class="card">
  <div>
    <span class="wordmark">gleon</span>
    <h1>Golden tests <em>13x</em> faster</h1>
  </div>
  <ul class="bars" aria-label="Time for one passing 390x844 golden">
    <li class="flutter"><p>Flutter SDK<span>15.5 ms</span></p><span class="bar" style="--w: 100%"></span></li>
    <li class="gleon"><p>gleon<span>1.19 ms</span></p><span class="bar" style="--w: 7.7%"></span></li>
  </ul>
  <p class="note">A passing 390x844 golden, Apple M3 Max.</p>
</div>
</body>
</html>
